version: "3"
tasks:
  # Utility Commands
  setup:
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint
      - go install golang.org/x/tools/cmd/goimports
      - go install google.golang.org/protobuf/cmd/protoc-gen-go
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc
  make-temp-files:
    cmds:
      - task: get-latest-tag
      - task: get-commit-hash
  get-latest-tag:
    cmds:
      - |
        git fetch --tags
        latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
        if [[ -z "$latest_tag" ]]; then
          echo "0.0.1" > .latest_tag
        else
          echo $latest_tag | awk -F. '{printf "%d.%d.%d", $1, $2, $3}' > .latest_tag
        fi
    silent: true
  get-commit-hash:
    cmd: git rev-parse --short HEAD > .commit_hash
    silent: true
  clean-git-file:
    cmds:
      - rm .latest_tag
      - rm .commit_hash
  fmt:
    cmds:
      - goimports -w .
      - gofmt -w .
      - go clean ./...
      - go mod tidy
  test:
    cmd: go test -v -race -bench=./... -benchmem -timeout=120s -cover -coverprofile=coverage.txt -covermode=atomic ./...

  clean:
    cmds:
      - go clean -cache -testcache -modcache
      - rm -rf ./bin
      - rm -rf ./dist
      - rm -rf ./coverage.txt

  go-secure:
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - staticcheck ./...
      - govulncheck ./...
      - gosec ./...
